<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>CepheidDx Portal - Create Order</title></head>
<body>
  <h1>Create Order</h1>
  <form id="order-form">
    <label for="customer-name">Customer Name</label>
    <input type="text" id="customer-name" name="customerName" />
    <label for="product-id">Product ID</label>
    <input type="text" id="product-id" name="productId" />
    <label for="quantity">Quantity</label>
    <input type="number" id="quantity" name="quantity" value="1" />
    <button type="submit" id="submit-order">Submit Order</button>
  </form>
  <p id="order-confirmation" style="display:none;">Order submitted successfully.</p>
  <script>
    document.getElementById('order-form').addEventListener('submit', function (e) {
      e.preventDefault();
      document.getElementById('order-confirmation').style.display = 'block';
    });
  </script>
</body>
</html>
